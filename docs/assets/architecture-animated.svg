<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      text { font-family: 'JetBrains Mono', monospace; }
      
      .bg-panel { fill: #0F172A; stroke: #1E293B; stroke-width: 2; rx: 8; }
      .soc-panel { fill: #020617; stroke: #334155; stroke-width: 2; rx: 8; }
      
      .arm-box { fill: #064E3B; stroke: #10B981; stroke-width: 2; rx: 4; }
      .fpga-box { fill: #4C1D95; stroke: #8B5CF6; stroke-width: 2; rx: 4; }
      .mem-box { fill: #7C2D12; stroke: #F97316; stroke-width: 2; rx: 4; }
      .block { fill: #1E293B; stroke: #94A3B8; stroke-width: 1.5; rx: 4; }
      
      .text-title { fill: #F8FAFC; font-size: 16px; font-weight: bold; }
      .text-subtitle { fill: #94A3B8; font-size: 12px; }
      .text-label { fill: #F8FAFC; font-size: 12px; }
      .text-small { fill: #94A3B8; font-size: 10px; }
      
      /* Animations */
      @keyframes flowLeftToRight {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.7; filter: brightness(1); }
        50% { opacity: 1; filter: brightness(1.5); }
      }
      
      .data-path {
        fill: none;
        stroke: #38BDF8;
        stroke-width: 3;
        stroke-dasharray: 10 10;
        animation: flowLeftToRight 1s linear infinite;
      }
      .axi-path {
        fill: none;
        stroke: #F43F5E;
        stroke-width: 4;
        stroke-dasharray: 12 12;
        animation: flowLeftToRight 0.8s linear infinite;
      }
      .mem-path {
        fill: none;
        stroke: #FBBF24;
        stroke-width: 3;
        stroke-dasharray: 8 8;
        animation: flowLeftToRight 1.2s linear infinite reverse;
      }
      .pulsing { animation: pulseNode 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#000000" />
  <rect x="20" y="20" width="960" height="460" class="bg-panel" />
  
  <text x="40" y="50" class="text-title" fill="#38BDF8">KRIA KV260 VISION AI PLATFORM</text>
  <text x="40" y="70" class="text-subtitle">ZYNQ ULTRASCALE+ MPSoC HARDWARE-SOFTWARE CO-DESIGN</text>

  <!-- SoC Boundary -->
  <rect x="150" y="100" width="700" height="300" class="soc-panel" />
  <text x="160" y="125" class="text-label" fill="#94A3B8">ZYNQ SoC</text>

  <!-- Processing System (ARM) -->
  <rect x="170" y="140" width="250" height="240" class="arm-box" />
  <text x="180" y="165" class="text-label" fill="#10B981">PROCESSING SYSTEM (PS)</text>
  <text x="180" y="180" class="text-small">ARM Cortex-A53 | PetaLinux</text>
  
  <rect x="190" y="200" width="210" height="40" class="block pulsing" />
  <text x="200" y="225" class="text-label">OpenCV Pre-Processing</text>
  
  <rect x="190" y="260" width="210" height="40" class="block" />
  <text x="200" y="285" class="text-label">XRT Control &amp; VART</text>
  
  <rect x="190" y="320" width="210" height="40" class="block pulsing" style="animation-delay: 1s;" />
  <text x="200" y="345" class="text-label">NMS Post-Processing</text>

  <!-- Programmable Logic (FPGA) -->
  <rect x="580" y="140" width="250" height="240" class="fpga-box" />
  <text x="590" y="165" class="text-label" fill="#8B5CF6">PROGRAMMABLE LOGIC (PL)</text>
  <text x="590" y="180" class="text-small">FPGA Fabric @ 275 MHz</text>
  
  <rect x="600" y="210" width="210" height="130" class="block" style="fill: #1E1B4B; stroke: #C084FC;" />
  <text x="610" y="235" class="text-label" fill="#E879F9">DPU ACCELERATOR (B4096)</text>
  <text x="610" y="255" class="text-small" fill="#C084FC">INT8 Quantized Engine</text>
  <text x="610" y="275" class="text-small" fill="#C084FC">4096 Operations/Cycle</text>
  
  <!-- DPU Inner blocks -->
  <rect x="610" y="290" width="60" height="40" fill="#4C1D95" rx="2" />
  <text x="620" y="315" class="text-small" fill="#fff">CONV</text>
  
  <rect x="680" y="290" width="50" height="40" fill="#4C1D95" rx="2" />
  <text x="690" y="315" class="text-small" fill="#fff">ReLU</text>
  
  <rect x="740" y="290" width="60" height="40" fill="#4C1D95" rx="2" />
  <text x="750" y="315" class="text-small" fill="#fff">POOL</text>

  <!-- Shared Memory (DDR) -->
  <rect x="350" y="420" width="300" height="60" class="mem-box" />
  <text x="410" y="445" class="text-label" fill="#F97316">SHARED DDR4 MEMORY</text>
  <text x="390" y="465" class="text-small">Tensors | Feature Maps | Weights</text>

  <!-- Camera Input -->
  <circle cx="80" cy="220" r="30" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <text x="55" y="225" class="text-label">CAM</text>
  <path class="data-path" d="M 110,220 L 190,220" />

  <!-- Display Output -->
  <rect x="900" y="320" width="60" height="40" fill="#1E293B" stroke="#00FFAA" stroke-width="2" />
  <text x="915" y="345" class="text-label">HDMI</text>
  <path class="data-path" d="M 400,340 L 900,340" style="stroke: #00FFAA;" />

  <!-- Internal Connections -->
  <!-- PS to PL (Control) -->
  <path class="axi-path" d="M 400,270 L 600,270" />
  <text x="470" y="260" class="text-small" fill="#F43F5E">AXI4-Lite Control</text>

  <!-- PS to DDR -->
  <path class="mem-path" d="M 295,360 L 295,450 L 350,450" />
  
  <!-- PL to DDR -->
  <path class="mem-path" d="M 705,340 L 705,450 L 650,450" />
  <text x="440" y="410" class="text-small" fill="#FBBF24">AXI4 HP / DMA (128-bit)</text>
  
</svg>
